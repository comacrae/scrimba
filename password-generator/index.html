<!DOCTYPE html>
    <html>
    <head>
        <title>Scrimba Password Generator</title>
        <link rel="stylesheet" href="styles.css"/>
        <script src="passwords.js" defer></script>
        <meta charset="utf-8"></meta>
        </head>
    <body>
        <main>
            <h1 class="header">Generate a
                <br> <span class="header-emph">random password</span>
            </h1>
            <p class="subtitle">Never use an insecure password again.</p>
            <button id="generate-btn" class="btn btn-generate">Generate passwords</button>
            <p class="hint"></p>

            <div class="password-container">
                <button class="btn btn-password"></button>
                <button class="btn btn-password"></button>

            </div>
            <div class="config-container">
                <input id="password-len" class="slider" 
                type="range" 
                min=6
                max=12
                step=1
                value=6>
                <label for="password-len">Password Length</label>
                <span id="len-val"></span>
                </input>
                <input id="special-char-toggle" class="switch" type="checkbox">
                <label for="special-char-toggle">Toggle special characters</label>
                </input>

            </div>
        </main>
    </body>
</html>
