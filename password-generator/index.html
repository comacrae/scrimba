<!DOCTYPE html>
    <html>
    <head>
        <meta charset="utf-8"/>
        <title>Scrimba Password Generator</title>
        <link rel="stylesheet" href="styles.css"/>
        <script src="passwords.js" defer></script>

        </head>
    <body>
        <main>
            <h1 class="header">Generate a
                <br> <span class="header-emph">random password</span>
            </h1>
            <p class="subtitle">Never use an insecure password again.</p>
            <button id="generate-btn" class="btn btn-generate">Generate passwords</button>
            <p class="hint"></p>

            <div class="password-container">
                <button class="btn btn-password"></button>
                <button class="btn btn-password"></button>

            </div>
            <div class="config-container">
                <div class="config-col">
                <label for="password-len">Password Length: <span id="len-val"></span></label>
                    
                    <input id="password-len" class="slider" 
                    type="range" 
                    min=6
                    max=12
                    step=1
                    value=6
                    />
                </div>
                <div class="config-row">
                    <input id="special-char-switch" class="switch" type="checkbox"/>
                    <label for="special-char-switch">Toggle special characters</label>
                </div>

            </div>
        </main>
    </body>
</html>
